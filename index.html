<!DOCTYPE html>
<!-- wrapper v1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Den Mother — Model</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html, body { height: 100%; background: #f5f3ee; font-family: 'Jost', sans-serif; }

/* iframe fills the viewport above the tab strip */
#frame {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 44px;          /* leave room for the tabs */
  width: 100%;
  height: calc(100% - 44px);
  border: 0;
  background: #f5f3ee;
}

/* sticky bottom tab strip */
#vtabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 44px;
  display: flex;
  align-items: stretch;
  background: #1a1a1a;
  border-top: 1px solid #333;
  z-index: 1000;
  font-family: 'Jost', sans-serif;
}
#vtabs .vt {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  background: transparent;
  border: 0;
  border-right: 1px solid #2a2a2a;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 120ms, background 120ms;
}
#vtabs .vt:last-child { border-right: 0; }
#vtabs .vt:hover { color: #ddd; background: #222; }
#vtabs .vt.on {
  color: #f5f3ee;
  background: #2a2a2a;
  box-shadow: inset 0 2px 0 #c8a020;  /* gold accent matches model palette */
}
</style>
</head>
<body>

<iframe id="frame" src="v1.html" title="Den Mother model"></iframe>

<nav id="vtabs">
  <button class="vt on" data-src="v1.html" onclick="pickVersion(this)">% of occupancy</button>
  <button class="vt"    data-src="v2.html" onclick="pickVersion(this)">Tickets per day</button>
</nav>

<script>
function pickVersion(btn) {
  const frame = document.getElementById('frame');
  const target = btn.getAttribute('data-src');
  if (frame.getAttribute('src') !== target) frame.setAttribute('src', target);
  document.querySelectorAll('#vtabs .vt').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  // remember selection so a refresh stays on the same version
  try { localStorage.setItem('denmother.version', target); } catch (e) {}
}

// restore last-selected version on load
(function () {
  let saved = null;
  try { saved = localStorage.getItem('denmother.version'); } catch (e) {}
  if (saved && (saved === 'v1.html' || saved === 'v2.html')) {
    const btn = document.querySelector('#vtabs .vt[data-src="' + saved + '"]');
    if (btn) pickVersion(btn);
  }
})();
</script>

</body>
</html>
